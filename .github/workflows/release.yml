# Push a tag matching package.json's version (e.g. v0.2.0-alpha) → a signed, notarized release on
# GitHub Releases, which installed copies pick up through the in-app ↑ update button.
# One-time setup (repo secrets): see RELEASING.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload its assets

jobs:
  release:
    runs-on: macos-15 # Apple Silicon: builds the arm64 app
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Check the tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match package.json version ${VERSION}" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Make sure Electron's binary is there
        run: test -d node_modules/electron/dist || node node_modules/electron/install.js

      - run: pnpm check

      # Signed and notarized when the signing secrets exist (RELEASING.md); otherwise an unsigned
      # stopgap release whose notes tell people how to open it.
      - name: Signing mode
        env:
          HAS_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
        run: |
          if [ "$HAS_CERT" = "true" ]; then echo "SIGNED=1" >> "$GITHUB_ENV"; else echo "::warning::No signing secrets: publishing an unsigned build."; fi

      - name: Notarization key
        if: env.SIGNED == '1'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, publish
        if: env.SIGNED == '1'
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release.sh --publish

      - name: Build and publish (unsigned)
        if: env.SIGNED != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release.sh --publish --unsigned
